[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyst-report-data-sources-pipeline"
version = "0.1.0"
description = "Standalone pipeline for preparing analyst report text, extracting cited data sources, and summarizing source usage."
readme = "README.md"
requires-python = ">=3.9.6"
dependencies = [
    "pandas>=2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
